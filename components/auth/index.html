<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verify Phone Modal</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
<!-- Open Button -->
<button
  onclick="document.getElementById('verifyModal').classList.remove('hidden')"
  class="bg-[#20B486] text-white font-medium px-5 py-2.5 rounded-lg transition"
>
  Open Verify Phone Modal
</button>

<!-- Open Button -->
<button
  onclick="document.getElementById('signinModal').classList.remove('hidden')"
  class="bg-[#20B486] text-white font-medium px-5 py-2.5 rounded-lg transition"
>
  Open Sign In Modal
</button>
<!-- Verify Phone Modal -->
<div
  id="verifyModal"
  class="fixed inset-0 hidden flex items-center justify-center bg-black/50 z-50"
>
  <div
    class="bg-white rounded-[20px] shadow-lg w-[90%] max-w-lg p-10 relative"
  >
    <!-- Close Button -->
    <button
      onclick="document.getElementById('verifyModal').classList.add('hidden')"
      class="absolute size-10 top-4 right-4 text-gray-500 bg-[#ECECEC] rounded-full p-2 hover:bg-gray-300 transition"
      aria-label="Close modal"
    >
      ✕
    </button>

    <!-- Title -->
    <h2 class="text-3xl font-bold mb-1">Verify Phone</h2>

    <!-- Description -->
    <p class="text-[#666666] mb-6 text-lg mt-4">
      Code has been sent to +xxxx-xxxx-2546
    </p>

    <!-- Label -->
    <label class="block text-sm font-medium text-[#666666] mb-2">
      Mobile No.
    </label>

    <!-- OTP Input Boxes -->
    <div class="flex gap-3 mb-6">
      <input
        type="text"
        maxlength="1"
        value="0"
        class="w-12 h-12 border border-[#CBD5E0] bg-[#F7FAFC] rounded-lg text-center text-sm font-medium value:text-sm focus:outline-none "
      />
      <input
        type="text"
        maxlength="1"
        value="0"
        class="w-12 h-12 border border-[#CBD5E0] bg-[#F7FAFC] rounded-lg text-center text-sm font-medium value:text-sm focus:outline-none "
      />
      <input
        type="text"
        maxlength="1"
        value="0"
        class="w-12 h-12 border border-[#CBD5E0] bg-[#F7FAFC] rounded-lg text-center text-sm font-medium value:text-sm focus:outline-none "
      />
      <input
        type="text"
        maxlength="1"
        value="0"
        class="w-12 h-12 border border-[#CBD5E0] bg-[#F7FAFC] rounded-lg text-center text-sm font-medium value:text-sm focus:outline-none "
      />
    </div>

    <!-- Resend Code -->
    <p class="text-sm text-gray-600 mb-6">
      Didn’t get OTP Code?
      <span class="text-[#20B486] font-medium cursor-pointer">Resend Code</span>
    </p>

    <!-- Verify Button -->
    <button
      class="w-full bg-[#20B486] text-white font-medium py-2.5 rounded-lg transition"
    >
      Verify
    </button>
  </div>
</div>



<!-- Sign In Modal -->
<div
  id="signinModal"
  class="fixed inset-0 hidden flex items-center justify-center bg-black/50 z-50"
>
  <div
    class="bg-white rounded-[20px] shadow-lg w-[90%] max-w-xl p-10 relative"
  >
    <!-- Close Button -->
    <button
      onclick="document.getElementById('signinModal').classList.add('hidden')"
      class="absolute size-10 top-4 right-4 text-gray-500 bg-[#ECECEC] rounded-full p-2 hover:bg-gray-300 transition"
      aria-label="Close modal"
    >
      ✕
    </button>

    <!-- Title -->
    <h2 class="text-3xl font-bold mb-1">Sign in</h2>

    <!-- Create Account -->
    <p class="text-[#666666] mb-6 text-lg mt-4">
      Don’t have an account?
      <span class="text-[#20B486] font-medium cursor-pointer underline"
        >Create now</span
      >
    </p>

    <!-- Email Input -->
    <label class="block text-sm font-medium text-[#666666] mb-2">E-mail</label>
    <input
      type="email"
      placeholder="example@gmail.com"
      class="w-full px-3 py-2 mb-4 border border-gray-300 rounded-lg bg-[#F7FAFC] text-gray-700 focus:outline-none "
    />

    <!-- Password Input -->
    <label class="block text-sm font-medium text-[#666666] mb-2">Password</label>
    <div class="relative mb-4 flex items-center">
      <input
        type="password"
        placeholder="••••••••"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-[#F7FAFC] text-gray-700 focus:outline-none "
      />
      <span
        class="absolute right-3 top-2.5 text-gray-400 cursor-pointer text-sm"
        >👁️</span
      >
    </div>

    <!-- Remember Me & Forgot Password -->
    <div class="flex items-center justify-between mb-6 text-sm">
      <label class="flex items-center gap-2 text-gray-600">
        <input type="checkbox" class="w-4 h-4" /> Remember me
      </label>
      <a href="#" class="text-[#20B486] font-medium">Forgot Password?</a>
    </div>

    <!-- Sign In Button -->
    <button
      class="w-full bg-[#20B486] text-white font-medium py-2.5 rounded-lg mb-4 transition"
    >
      Sign in
    </button>

    <!-- OR Line -->
    <div class="flex items-center my-4">
      <div class="flex-grow h-px bg-gray-300"></div>
      <span class="px-3 text-black text-sm">OR</span>
      <div class="flex-grow h-px bg-gray-300"></div>
    </div>

    <!-- Social Buttons -->
    <div class="flex flex-col gap-3">
        <div class="flex gap-3">

            <button
              class="flex items-center justify-center gap-2 border border-gray-300 rounded-lg py-2.5 w-full hover:bg-gray-50"
            >
              <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="fb" class="w-5 h-5" />
              Continue with Facebook
            </button>
      
            <button
              class="flex items-center justify-center gap-2 border border-gray-300 rounded-lg py-2.5 w-full hover:bg-gray-50"
            >
              <img src="https://www.svgrepo.com/show/355037/google.svg" alt="google" class="w-5 h-5" />
              Continue with Google
            </button>
        </div>

      <button
        class="flex items-center justify-center gap-2 border border-gray-300 rounded-lg py-2.5 w-full hover:bg-gray-50"
      >
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

            </svg>

        Continue with Mobile Number
      </button>
    </div>
  </div>
</div>


  </body>
</html>

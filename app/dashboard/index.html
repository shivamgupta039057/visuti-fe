<script src="https://unpkg.com/flowbite@latest/dist/flowbite.min.js"></script>

 <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

 <script>
  // 👇 Set the current status here
  const status = "waiting"; // "booking" | "waiting" | "available"

  const tableCard = document.getElementById("tableCard");
  const tableStatus = document.getElementById("tableStatus");

  // First, reset all previous classes
  tableCard.classList.remove(
    "border-[#009245]",
    "bg-[#E0FFEF]",
    "border-[#FF9800]",
    "bg-[#FFF4E5]",
    "border-gray-300",
    "bg-white"
  );

  tableStatus.classList.remove("bg-[#009245]", "bg-[#FF9800]", "bg-gray-400");

  // Apply based on status
  if (status === "booking") {
    tableCard.classList.add("border-[#009245]", "bg-[#E0FFEF]");
    tableStatus.classList.add("bg-[#009245]");
    tableStatus.textContent = "Running since 08:00";
  } else if (status === "waiting") {
    tableCard.classList.add("border-[#FF9800]", "bg-[#FFF4E5]");
    tableStatus.classList.add("bg-[#FF9800]");
    tableStatus.textContent = "Waiting...";
  } else if (status === "available") {
    tableCard.classList.add("border-gray-300", "bg-white");
    tableStatus.classList.add("bg-gray-400");
    tableStatus.textContent = "Available";
  }
</script>


<script>

let isExpanded = false;

function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  const labels = document.querySelectorAll(".label");
  const items = document.querySelectorAll(".sidebar-item");
  const arrow = document.querySelector(".sidebar-toggle-arrow"); // Get the arrow image

  if (isExpanded) {
    sidebar.classList.remove("w-64");
    sidebar.classList.add("w-[75px]");
    labels.forEach(label => label.classList.add("hidden"));
    items.forEach(item => {
      item.classList.remove("justify-start");
      item.classList.add("justify-center");
    });
    arrow.classList.remove("rotate-180"); // Remove rotation when sidebar closes
  } else {
    sidebar.classList.remove("w-[75px]");
    sidebar.classList.add("w-64");
    labels.forEach(label => label.classList.remove("hidden"));
    items.forEach(item => {
      item.classList.remove("justify-center");
      item.classList.add("justify-start");
    });
    arrow.classList.add("rotate-180"); // Add rotation when sidebar opens
  }

  isExpanded = !isExpanded;
}

</script>
